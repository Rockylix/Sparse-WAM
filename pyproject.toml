[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-wam-cosmos3"
version = "0.1.0"
description = "Action-guided sparse imagination for Cosmos3 Edge and Nano policies"
requires-python = ">=3.10"
license = {text = "OpenMDW-1.1"}
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sparse-wam = "sparse_wam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["vendor"]
